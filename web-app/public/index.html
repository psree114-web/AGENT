<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhD/Research Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">PhD Research Engine</h1>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">API Key (Securely stored in browser)</label>
            <input type="password" id="apiKey" class="w-full mt-1 p-2 border rounded" placeholder="sk-ant-...">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Level / Task Type</label>
            <select id="taskLevel" class="w-full mt-1 p-2 border rounded">
                <option value="PhD">PhD (Rigorous, Theory-heavy)</option>
                <option value="Masters">Masters (Structured, Explanatory)</option>
                <option value="Customer">Customer (Professional, Polished)</option>
            </select>
        </div>

        <textarea id="prompt" class="w-full h-32 p-2 border rounded mb-4" placeholder="Enter your assignment or task..."></textarea>

        <button onclick="sendToClaude()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">Process Task</button>

        <div id="result" class="mt-6 p-4 bg-gray-50 rounded border text-sm whitespace-pre-wrap"></div>
    </div>

    <script>
        async function sendToClaude() {
            const key = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            const level = document.getElementById('taskLevel').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerText = "Processing...";

            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'x-api-key': key,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json',
                    'anthropic-dangerous-direct-browser-access': 'true' // Note: This is for local/dev use
                },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20241022",
                    max_tokens: 1024,
                    system: `You are a research assistant. The user is at the ${level} level. Act with the appropriate rigor, depth, and tone for this level.`,
                    messages: [{role: "user", content: prompt}]
                })
            });
            const data = await response.json();
            resultDiv.innerText = data.content[0].text;
        }
    </script>
</body>
</html>
